<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mestre do PC V9</title>
<link rel="icon" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030014;
  --surface:#0a0a1f;
  --surface2:#11112b;
  --border:#1a1a3e;
  --text:#e0e0ff;
  --muted:#8888aa;
  --accent:#00f0ff;
  --accent2:#ff00ff;
  --success:#00ff88;
  --warning:#ffcc00;
  --danger:#ff3366;
  --glow:rgba(0,240,255,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(circle at 50% 0%,#1a1a3e 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
body{overflow-x:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--accent);color:#000}

header{
  position:sticky;top:0;z-index:100;
  background:rgba(3,0,20,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:20px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px;
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;text-shadow:0 0 20px var(--glow)}
.logo span{color:var(--accent2)}
.header-right{display:flex;align-items:center;gap:16px}
.badge{font-family:'DM Mono',monospace;font-size:.72rem;padding:6px 12px;border:1px solid var(--border);border-radius:4px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success)}
.badge.off .dot{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.badge.off{color:var(--danger)}
.btn{font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;transition:all .2s}
.btn:hover{background:var(--accent);color:#000;box-shadow:0 0 20px var(--glow)}
.btn.sec{border-color:var(--accent2);color:var(--accent2)}
.btn.sec:hover{background:var(--accent2);color:#000;box-shadow:0 0 20px rgba(255,0,255,.3)}

.container{max-width:1400px;margin:0 auto;padding:48px 40px}
.hero{text-align:center;margin-bottom:64px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:5rem;text-transform:uppercase;letter-spacing:.15em;text-shadow:0 0 40px var(--glow),0 0 80px var(--glow);animation:flicker 3s ease-in-out infinite;line-height:1}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.95}52%{opacity:1}54%{opacity:.9}56%{opacity:1}}
.hero p{font-size:1rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:64px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stat .v{font-family:'DM Mono',monospace;font-size:2.5rem;font-weight:600;color:var(--accent);text-shadow:0 0 20px var(--glow)}
.stat .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-top:8px}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.section-title::before{content:'';width:4px;height:32px;background:var(--accent);box-shadow:0 0 20px var(--glow)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:28px;cursor:pointer;transition:all .3s;position:relative}
.card:hover{border-color:var(--accent);box-shadow:0 0 40px var(--glow),inset 0 0 20px rgba(0,240,255,.05);transform:translateY(-4px)}
.card .icon{width:56px;height:56px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:20px}
.card h3{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.card p{font-size:.8rem;color:var(--muted);line-height:1.6}
.card.running{border-color:var(--warning);box-shadow:0 0 30px rgba(255,204,0,.3)}

.log{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;font-family:'DM Mono',monospace;margin-bottom:80px}
.log-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.log-dot{width:10px;height:10px;border-radius:50%}
.log-dot.r{background:#ff5f56}.log-dot.y{background:#ffbd2e}.log-dot.g{background:#27ca40}
.log-title{margin-left:auto;font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.log-body{max-height:280px;overflow-y:auto;font-size:.75rem;line-height:1.5}
.log-body::-webkit-scrollbar{width:6px}.log-body::-webkit-scrollbar-thumb{background:var(--border)}
.log-entry{display:flex;gap:12px;padding:4px 0}
.log-time{color:var(--muted);flex-shrink:0}
.log-ok{color:var(--success);text-shadow:0 0 10px rgba(0,255,136,.5)}
.log-info{color:var(--accent)}
.log-warn{color:var(--warning)}
.log-err{color:var(--danger)}

/* Terminal modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 60px var(--glow);border-radius:6px;width:100%;max-width:900px;max-height:85vh;display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;color:var(--accent)}
.modal-head .x{background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer}
.modal-head .x:hover{color:var(--danger)}
.modal-body{padding:20px;overflow-y:auto;font-family:'DM Mono',monospace;font-size:.8rem;white-space:pre-wrap;color:var(--text);flex:1}
.modal-body .busy{color:var(--warning)}

/* AI chat */
.ai-fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--surface);border:1px solid var(--accent);color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.05em;box-shadow:0 0 30px var(--glow);z-index:150;transition:all .2s;display:flex;align-items:center;justify-content:center}
.ai-fab:hover{transform:scale(1.1);box-shadow:0 0 50px var(--glow)}
.ai-fab .pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.4);opacity:0}}

.chat{position:fixed;bottom:96px;right:24px;width:380px;max-width:calc(100vw - 48px);height:560px;max-height:calc(100vh - 130px);background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 60px var(--glow);border-radius:8px;z-index:160;display:none;flex-direction:column}
.chat.open{display:flex}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-head h3{font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;color:var(--accent);font-size:1.1rem;flex:1}
.chat-status{font-family:'DM Mono',monospace;font-size:.7rem;display:flex;align-items:center;gap:6px}
.chat-status .d{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
.chat-status.off .d{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.chat-status.off{color:var(--danger)}
.chat-status.on{color:var(--success)}
.chat-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.chat-close:hover{color:var(--danger)}
.chat-controls{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.chat-controls label{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.chat-controls select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:.75rem;padding:6px 8px;border-radius:3px;outline:none}
.chat-controls select:focus{border-color:var(--accent)}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.chat-body::-webkit-scrollbar{width:6px}.chat-body::-webkit-scrollbar-thumb{background:var(--border)}
.msg{font-size:.85rem;line-height:1.5;max-width:100%;word-wrap:break-word}
.msg.user{align-self:flex-end;background:rgba(0,240,255,.08);border:1px solid var(--border);padding:8px 12px;border-radius:6px;color:var(--text)}
.msg.ai{align-self:flex-start;color:var(--text)}
.msg.ai pre{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;margin:8px 0;overflow-x:auto;font-family:'DM Mono',monospace;font-size:.78rem;position:relative}
.msg.ai pre .run{position:absolute;top:4px;right:4px;font-family:'DM Mono',monospace;font-size:.65rem;padding:3px 8px;background:var(--accent);color:#000;border:none;border-radius:3px;cursor:pointer;letter-spacing:.05em}
.msg.ai pre .run:hover{background:var(--accent2)}
.msg.ai code{font-family:'DM Mono',monospace;color:var(--accent)}
.msg.ai p{margin:6px 0}
.msg.ai ul,.msg.ai ol{margin:6px 0 6px 20px}
.msg.ai strong{color:var(--accent2)}
.msg.sys{align-self:center;color:var(--muted);font-size:.72rem;font-family:'DM Mono',monospace}
.msg.err{color:var(--danger)}
.chat-input{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input textarea{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.85rem;padding:8px 10px;border-radius:4px;resize:none;outline:none;height:60px;max-height:120px}
.chat-input textarea:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:#000;border:none;padding:0 18px;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;border-radius:4px;cursor:pointer;transition:all .2s}
.chat-input button:hover{box-shadow:0 0 20px var(--glow)}
.chat-input button:disabled{opacity:.4;cursor:not-allowed}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:3rem}
  .container{padding:32px 20px}
  header{padding:16px 20px}
  .chat{width:calc(100vw - 32px);right:16px;bottom:88px}
}
</style>
</head>
<body>

<header>
  <div class="logo">MESTRE <span>V9</span></div>
  <div class="header-right">
    <div id="sysBadge" class="badge off"><span class="dot"></span><span id="sysBadgeTxt">CONECTANDO</span></div>
    <button class="btn sec" id="termBtn">TERMINAL</button>
  </div>
</header>

<div class="container">
  <section class="hero">
    <h1>SYSTEM READY</h1>
    <p>Windows Optimization Suite // v9.0.0</p>
  </section>

  <div class="stats" id="stats">
    <div class="stat"><div class="v" id="sCpu">--</div><div class="l">CPU Load %</div></div>
    <div class="stat"><div class="v" id="sRam">--</div><div class="l">RAM Free GB</div></div>
    <div class="stat"><div class="v" id="sDisk">--</div><div class="l">Disk Free GB</div></div>
    <div class="stat"><div class="v" id="sUp">--</div><div class="l">Uptime</div></div>
  </div>

  <h2 class="section-title">Core Modules</h2>
  <div class="grid" id="modules"></div>

  <h2 class="section-title">Activity Log</h2>
  <div class="log">
    <div class="log-header">
      <div class="log-dot r"></div><div class="log-dot y"></div><div class="log-dot g"></div>
      <span class="log-title">mestre-v9 — activity.log</span>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<!-- Terminal modal -->
<div class="modal" id="termModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="termTitle">TERMINAL</h3>
      <button class="x" id="termClose">×</button>
    </div>
    <div class="modal-body" id="termBody">[aguardando comando...]</div>
  </div>
</div>

<!-- AI chat -->
<button class="ai-fab" id="aiFab" title="Abrir chat IA"><span class="pulse"></span>AI</button>
<div class="chat" id="chat">
  <div class="chat-head">
    <h3>MESTRE AI</h3>
    <div class="chat-status off" id="chatStatus"><span class="d"></span><span id="chatStatusTxt">offline</span></div>
    <button class="chat-close" id="chatClose">×</button>
  </div>
  <div class="chat-controls">
    <label>MODEL</label>
    <select id="modelSelect"><option value="">--</option></select>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <textarea id="chatInput" placeholder="Pergunte sobre seu PC... (Enter envia, Shift+Enter nova linha)"></textarea>
    <button id="chatSend">SEND</button>
  </div>
</div>

<script>
const MODULES = [
  { id:'clean', icon:'🧹', title:'System Clean', desc:'Purge temp files and clear system cache instantly.',
    cmd:'Remove-Item "$env:TEMP\\*" -Recurse -Force -EA 0; Remove-Item "C:\\Windows\\Temp\\*" -Recurse -Force -EA 0; Clear-RecycleBin -Force -EA 0; Write-Host "OK Limpeza concluida" -ForegroundColor Green' },
  { id:'ram', icon:'⚡', title:'RAM Boost', desc:'Free memory with .NET Garbage Collector injection.',
    cmd:'[System.GC]::Collect(); [System.GC]::WaitForPendingFinalizers(); Write-Host "OK RAM liberada" -ForegroundColor Green' },
  { id:'repair', icon:'🔧', title:'System Repair', desc:'Run SFC and DISM to fix corrupted Windows files.',
    cmd:'sfc /scannow; Write-Host ""; DISM /Online /Cleanup-Image /RestoreHealth; Write-Host "OK Reparo concluido" -ForegroundColor Green' },
  { id:'net', icon:'🌐', title:'Network Diagnostic', desc:'ipconfig /all, flush DNS and renew IP.',
    cmd:'ipconfig /all; Write-Host ""; ipconfig /flushdns; ipconfig /release; ipconfig /renew; Write-Host "OK Rede renovada" -ForegroundColor Green' },
  { id:'defender', icon:'🛡️', title:'Defender Scan', desc:'Quick scan with Windows Defender.',
    cmd:'Start-MpScan -ScanType QuickScan; Write-Host "OK Scan rapido iniciado" -ForegroundColor Green' },
  { id:'info', icon:'📋', title:'System Info', desc:'Show Windows product, CPU, RAM and disks.',
    cmd:'Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture,CsName,CsProcessors,CsTotalPhysicalMemory | Format-List; Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{N="Usado(GB)";E={[math]::Round(($_.Used/1GB),2)}},@{N="Livre(GB)";E={[math]::Round(($_.Free/1GB),2)}} | Format-Table -AutoSize' },
];

const $ = id => document.getElementById(id);
const logBody = $('logBody');
let logCount = 0;

function nowStr(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}
function addLog(text, type='info'){
  const e = document.createElement('div');
  e.className = 'log-entry';
  e.innerHTML = `<span class="log-time">${nowStr()}</span><span class="log-${type}">${text}</span>`;
  logBody.prepend(e);
  if (++logCount > 60) logBody.lastChild.remove();
}

async function api(path, opts){
  const r = await fetch(path, opts);
  return r;
}
async function getJson(path){
  const r = await fetch(path);
  return r.json();
}

async function pingSystem(){
  try{
    const d = await getJson('/ping');
    const badge = $('sysBadge'), txt = $('sysBadgeTxt');
    if (d.status === 'ok'){
      badge.classList.remove('off');
      txt.textContent = 'SYSTEM ONLINE';
    } else {
      badge.classList.add('off');
      txt.textContent = 'OFFLINE';
    }
  }catch{
    $('sysBadge').classList.add('off');
    $('sysBadgeTxt').textContent = 'OFFLINE';
  }
}

function fmtUptime(sec){
  sec = Number(sec)||0;
  const d = Math.floor(sec/86400);
  const h = Math.floor((sec%86400)/3600);
  const m = Math.floor((sec%3600)/60);
  if (d>0) return d+'d'+h+'h';
  if (h>0) return h+'h'+m+'m';
  return m+'m';
}

async function loadStatus(){
  try{
    const s = await getJson('/status');
    if (s.error){ return; }
    $('sCpu').textContent = (s.cpu!=null? s.cpu : '--')+'%';
    $('sRam').textContent = (s.ramFreeGB!=null? s.ramFreeGB : '--');
    $('sDisk').textContent = (s.diskFreeGB!=null? s.diskFreeGB : '--');
    $('sUp').textContent = fmtUptime(s.uptimeSec);
  }catch{}
}

function renderModules(){
  const wrap = $('modules');
  MODULES.forEach(m => {
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.id = m.id;
    c.innerHTML = `<div class="icon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p>`;
    c.addEventListener('click', () => runModule(m, c));
    wrap.appendChild(c);
  });
}

async function runModule(m, card){
  if (card.classList.contains('running')) return;
  card.classList.add('running');
  addLog('[RUN] '+m.title, 'info');
  openTerminal(m.title);
  setTerminal('[enviando comando para o launcher...]\n');
  try{
    const r = await fetch('/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cmd:m.cmd})
    });
    const d = await r.json();
    if (!d.success || !d.jobId){
      setTerminal('[erro] '+(d.error||'comando recusado')+'\n');
      addLog('[ERR] '+m.title+': '+(d.error||'recusado'), 'err');
      card.classList.remove('running');
      return;
    }
    await pollJob(d.jobId, m.title);
    addLog('[OK] '+m.title+' concluido', 'ok');
  }catch(e){
    setTerminal('[erro] '+e.message+'\n');
    addLog('[ERR] '+m.title+': '+e.message, 'err');
  }finally{
    card.classList.remove('running');
  }
}

async function pollJob(jobId, title){
  const start = Date.now();
  const deadline = start + 15*60*1000;
  while (Date.now() < deadline){
    let d;
    try{ d = await getJson('/run-status?id='+encodeURIComponent(jobId)); }
    catch(e){ await sleep(1500); continue; }
    if (d.state === 'running'){
      setTerminal(d.output || '');
      await sleep(1200);
      continue;
    }
    setTerminal((d.output||'') + '\n\n[exit code '+d.code+'] ['+d.state+']');
    return d;
  }
  setTerminal('[timeout aguardando job]\n');
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* Terminal modal */
function openTerminal(title){
  $('termTitle').textContent = title || 'TERMINAL';
  $('termBody').textContent = '[aguardando output...]';
  $('termModal').classList.add('open');
}
function setTerminal(text){
  $('termBody').textContent = text;
  const b = $('termBody');
  b.scrollTop = b.scrollHeight;
}
$('termClose').addEventListener('click', () => $('termModal').classList.remove('open'));
$('termBtn').addEventListener('click', () => {
  openTerminal('TERMINAL LIVRE');
  setTerminal('Digite um comando PowerShell abaixo (nao implementado neste modal — use os modulos).');
});

/* AI Chat */
let chatOpen = false;
let ollamaOnline = false;
let currentModel = '';
let chatHistory = [];
let sending = false;

const chatEl = $('chat');
const fabEl = $('aiFab');
const bodyEl = $('chatBody');
const inputEl = $('chatInput');
const sendBtn = $('chatSend');
const statusEl = $('chatStatus');
const statusTxt = $('chatStatusTxt');
const modelSel = $('modelSelect');

function setChatStatus(on){
  ollamaOnline = on;
  if (on){ statusEl.classList.remove('off'); statusEl.classList.add('on'); statusTxt.textContent='online'; }
  else { statusEl.classList.add('off'); statusEl.classList.remove('on'); statusTxt.textContent='offline'; }
}

function addMsg(role, text){
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  if (role === 'ai') m.innerHTML = renderMarkdown(text);
  else if (role === 'sys') m.textContent = text;
  else if (role === 'err') { m.className='msg ai err'; m.textContent = text; }
  else m.textContent = text;
  bodyEl.appendChild(m);
  bodyEl.scrollTop = bodyEl.scrollHeight;
  return m;
}

function renderMarkdown(t){
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  let parts = t.split(/(```[\s\S]*?```)/g);
  let html = '';
  parts.forEach(p => {
    if (p.startsWith('```') && p.endsWith('```')){
      const inner = p.slice(3,-3);
      const nl = inner.indexOf('\n');
      let lang = '', code = inner;
      if (nl > -1){ lang = inner.slice(0,nl).trim(); code = inner.slice(nl+1); }
      const id = 'run-'+Math.random().toString(36).slice(2,8);
      html += `<pre><button class="run" data-code="${encodeURIComponent(code)}">EXECUTAR</button><code>${esc(code)}</code></pre>`;
    } else {
      let line = esc(p);
      line = line.replace(/`([^`]+)`/g, '<code>$1</code>');
      line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      const lines = line.split('\n').map(l => l.trim()? '<p>'+l+'</p>' : '');
      html += lines.join('');
    }
  });
  return html;
}

bodyEl.addEventListener('click', async (ev) => {
  if (ev.target.classList.contains('run')){
    const code = decodeURIComponent(ev.target.dataset.code);
    addMsg('sys','[executando no launcher...]');
    try{
      const r = await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:code})});
      const d = await r.json();
      if (!d.success){ addMsg('err','Comando recusado: '+(d.error||'')); return; }
      let final = '';
      const deadline = Date.now() + 5*60*1000;
      while (Date.now() < deadline){
        const s = await getJson('/run-status?id='+encodeURIComponent(d.jobId));
        if (s.state !== 'running'){ final = s.output || ''; break; }
        await sleep(1000);
      }
      addMsg('ai', '```powershell\n'+(final||'[sem output]')+'\n```');
    }catch(e){ addMsg('err', e.message); }
  }
});

async function checkOllama(){
  try{
    const r = await fetch('/ollama/tags');
    if (!r.ok) throw new Error('http '+r.status);
    const d = await r.json();
    setChatStatus(true);
    modelSel.innerHTML = '';
    const models = d.models || [];
    if (models.length === 0){
      modelSel.innerHTML = '<option value="">(nenhum modelo — rode ollama pull)</option>';
      return;
    }
    models.forEach(m => {
      const o = document.createElement('option');
      o.value = m.name;
      o.textContent = m.name;
      modelSel.appendChild(o);
    });
    if (!currentModel || !models.some(m=>m.name===currentModel)){
      currentModel = models[0].name;
      modelSel.value = currentModel;
    }
  }catch{
    setChatStatus(false);
    modelSel.innerHTML = '<option value="">(ollama offline)</option>';
  }
}

modelSel.addEventListener('change', () => {
  currentModel = modelSel.value;
  addMsg('sys','[modelo selecionado: '+(currentModel||'nenhum')+']');
});

function openChat(){
  chatEl.classList.add('open');
  chatOpen = true;
  if (bodyEl.children.length === 0){
    addMsg('ai', 'Ola. Sou o **Mestre AI** — assistente de manutencao Windows. Pergunte sobre desempenho, limpeza, rede, processos, etc. Quando sugiro comandos, voce pode executa-los direto pelo botao **EXECUTAR**.');
  }
  checkOllama();
}
function closeChat(){ chatEl.classList.remove('open'); chatOpen = false; }

fabEl.addEventListener('click', () => { if (chatOpen) closeChat(); else openChat(); });
$('chatClose').addEventListener('click', closeChat);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});
sendBtn.addEventListener('click', sendChat);

async function sendChat(){
  if (sending) return;
  const text = inputEl.value.trim();
  if (!text) return;
  if (!ollamaOnline || !currentModel){
    addMsg('err','Ollama offline ou nenhum modelo selecionado. Verifique se ollama serve esta rodando.');
    return;
  }
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  addMsg('user', text);
  chatHistory.push({role:'user', content:text});
  const aiEl = addMsg('ai','');
  aiEl.innerHTML = '<span style="color:var(--muted)">[gerando...]</span>';

  const sys = { role:'system', content:'Voce e o Mestre do PC, assistente especializado em manutencao Windows. Responda em portugues brasileiro, de forma direta. Quando sugerir acoes, inclua comandos PowerShell em blocos ```powershell ... ``` para que o usuario possa executa-los. NUNCA invente comandos.' };
  const messages = [sys, ...chatHistory.slice(-12)];

  try{
    const r = await fetch('/ollama/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model: currentModel, messages, stream:true })
    });
    if (!r.ok){ throw new Error('http '+r.status); }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let full = '';
    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines){
        if (!ln.trim()) continue;
        try{
          const obj = JSON.parse(ln);
          if (obj.message && obj.message.content){ full += obj.message.content; }
          if (obj.error){ full += '\n[erro: '+obj.error+']'; }
        }catch{}
      }
      aiEl.innerHTML = renderMarkdown(full) + '<span class="cursor">▌</span>';
      bodyEl.scrollTop = bodyEl.scrollHeight;
    }
    aiEl.innerHTML = renderMarkdown(full);
    chatHistory.push({role:'assistant', content:full});
  }catch(e){
    aiEl.classList.add('err');
    aiEl.textContent = 'Falha: '+e.message;
    setChatStatus(false);
  }finally{
    sending = false;
    sendBtn.disabled = false;
  }
}

/* Boot */
renderModules();
addLog('[BOOT] Mestre V9 iniciado', 'info');
pingSystem();
loadStatus();
setInterval(pingSystem, 5000);
setInterval(loadStatus, 10000);
checkOllama();
</script>
